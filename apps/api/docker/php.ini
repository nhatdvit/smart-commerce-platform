; Application PHP settings. Loaded last, so these win over the defaults.

; --- Errors -----------------------------------------------------------------
; Never render errors to the client; Laravel's handler owns the response body
; and the logs are the only place a stack trace belongs.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; --- Limits -----------------------------------------------------------------
memory_limit = 256M
max_execution_time = 30
; The gateway caps request size too; this is the inner bound.
post_max_size = 2M
upload_max_filesize = 2M
max_input_vars = 1000

; --- Security ---------------------------------------------------------------
expose_php = Off
; Only the front controller is ever executed.
cgi.fix_pathinfo = 0
allow_url_fopen = On
allow_url_include = Off

; --- Dates / encoding -------------------------------------------------------
; Application time is UTC; store-local time is computed per store.
date.timezone = UTC
default_charset = UTF-8

; --- OPcache ----------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Production code never changes in place, so skip the stat() on every include.
; ini files expand ${ENV_VAR}; the Dockerfile sets this to 0 and the dev
; compose override sets it to 1 so edited PHP takes effect without a rebuild.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; --- Sessions ---------------------------------------------------------------
; Laravel manages its own session store; PHP's native one is unused.
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
