; PHP-FPM pool tuning. Overrides the packaged www pool.
[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000

; Dynamic keeps idle memory down while absorbing bursts. Raise max_children
; only together with the PostgreSQL connection limit: every busy child can
; hold a database connection.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle children periodically to bound the damage from any slow leak.
pm.max_requests = 500

; Exposes the pool status to the healthcheck script over FastCGI.
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; Log slow requests so a hanging dependency is visible, not just felt.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
; Hard stop above the php.ini limit, so FPM wins if a script ignores it.
request_terminate_timeout = 60s

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
