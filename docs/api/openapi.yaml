# Smart Commerce Platform — designed API contract
#
# This file is HAND-WRITTEN and is the design authority for /api/v1. It is
# written before the code, reviewed as a design, and implemented against.
#
# It is not the same artifact as openapi.json next to it:
#
#   openapi.yaml   what the API is designed to be   (this file, hand-written)
#   openapi.json   what the API currently is        (generated by Scramble)
#
# CI compares them with infra/scripts/check-openapi-conformance.mjs. The rule is
# conformance, not completeness: anything implemented must appear here and must
# not answer with a status this file does not promise. Designed-but-unbuilt
# operations are reported as remaining work, never as a failure — otherwise a
# design-first document could never be written ahead of the code.
#
# Conventions that apply to every operation, so they are not repeated:
#
#   * Field names are snake_case. Money is an object, never a bare number.
#   * Every error shares one envelope with a stable machine-readable `code`.
#     Clients branch on `code`, never on `message`.
#   * Lists are cursor-paginated. Offset pagination is not used anywhere.
#   * X-Request-Id is echoed on every response, success or failure.
#   * Store context is resolved from the route, a configured host mapping or the
#     single-store default — NEVER from a client-supplied query parameter.
#
# Sections marked `x-provisional: true` depend on a business decision still open
# in CLAUDE.md §15. They are designed configurably rather than invented, and the
# shape may change once the decision lands.

openapi: 3.1.1

info:
  title: Smart Commerce Platform
  version: 1.0.0
  summary: Customer storefront and store-operations API.
  description: |
    Customer storefront and operations API for the Smart Commerce Platform.

    **Money.** Amounts are whole Vietnamese đồng carried as an object with a
    decimal string: `{"amount": "45000", "currency": "VND"}`. JSON numbers
    cannot hold a 64-bit integer safely in every client, and an amount without
    its currency invites a client to format it with the wrong one. Never parse
    an amount into a float.

    **Errors.** Every failure returns the same envelope with a stable
    machine-readable `code`; branch on that, never on `message`. A resource that
    exists but belongs to another store answers 404, not 403, so the API cannot
    be used to enumerate objects.

    **Store scope.** Admin operations require both the role permission and an
    active membership of the target store. Store context comes from the route or
    the host, never from a query parameter.

    **Payments.** MVP settles in `CASH` or `BANK_TRANSFER` only. A generated
    VietQR is not a confirmation of payment: authorized staff confirm the actual
    bank credit. Nothing a customer can do — displaying the QR, uploading a
    screenshot, pressing a button — moves a payment to `PAID`.

    **Idempotency.** Order creation and manual payment confirmation require an
    `Idempotency-Key`. A retry with the same key replays the first outcome
    instead of repeating the operation.
  license:
    name: Proprietary
  contact:
    name: Smart Commerce Platform team

servers:
  - url: http://localhost:8080/api/v1
    description: Local
  - url: https://staging.example.com/api/v1
    description: Staging
  - url: https://example.com/api/v1
    description: Production

# Health probes (/health/live, /health/ready) are deliberately absent: they are
# an orchestration contract outside the versioned business API.

tags:
  - name: Meta
    description: Service metadata and the authenticated principal.
  - name: Auth
    description: Session lifecycle for the first-party web apps.
  - name: Store
    description: Store identity, opening hours and offered fulfillment.
  - name: Catalog
    description: Master data. What exists, independent of where or when it sells.
  - name: Menu
    description: What is actually sellable now, at which store price.
  - name: Cart
    description: Guest or authenticated basket. Prices are server-authoritative.
  - name: Order
    description: Checkout and order lifecycle.
  - name: Payment
    description: Cash collection and VietQR bank transfer.
  - name: Customer
    description: Profile, saved addresses and own order history.
  - name: Admin - Orders
    description: Operations queue and validated status transitions.
  - name: Admin - Payments
    description: Manual verification of bank credits and cash collection.
  - name: Admin - Catalog
    description: Product and modifier master data.
  - name: Admin - Menu
    description: Menus, schedules, prices and sold-out state.
  - name: Admin - Inventory
    description: Daily portions and stock limits.
  - name: Admin - Store
    description: Store settings, receiving bank account and payment methods.

# Cookie session by default. Operations that are public or use a different
# mechanism override this with their own `security`.
security:
  - sanctumSession: []

paths:
  /:
    get:
      operationId: getApiMetadata
      tags: [Meta]
      summary: Service metadata
      description: |
        Unauthenticated metadata for the business API. Useful as a cheap check
        that a client is talking to the expected API version.
      security: []
      responses:
        '200':
          description: Metadata for this API instance.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMetadata'

  /me:
    get:
      operationId: getCurrentUser
      tags: [Meta]
      summary: The authenticated principal
      description: |
        Identifies the caller behind the current session. The customer app uses
        it to decide whether to show a signed-in shell; the admin app uses the
        roles and memberships to decide which navigation a user may see.
      responses:
        '200':
          description: The authenticated user with roles and store memberships.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Start a session
      description: |
        Cookie authentication for the first-party web apps. Call
        `GET /sanctum/csrf-cookie` first — it sits outside `/api/v1` and so is
        not part of this document — then post credentials with
        `withCredentials`.

        Rate limited per credential *and* per IP, so neither one account nor one
        host can be brute-forced cheaply. The response never reveals whether the
        email exists: bad credentials and an unknown address answer alike.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established; the session cookie is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: End the session
      description: Idempotent. Calling it without a session is not an error.
      responses:
        '204':
          description: Session destroyed.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /stores/{store}:
    get:
      operationId: getStore
      tags: [Store]
      summary: Store profile and opening hours
      description: |
        Public store information: display name, timezone, opening hours, known
        closures and which fulfillment types it offers. Schedules are evaluated
        in the store timezone while timestamps are returned in UTC, so a client
        must not decide "open now" from its own clock.
      security: []
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '200':
          description: The store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      operationId: listCategories
      tags: [Catalog]
      summary: Category tree
      description: |
        Master-data categories, ordered by `sort_order`. A category appearing
        here does not imply anything in it is sellable right now; that is what
        the menu decides.
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'

  /products:
    get:
      operationId: listProducts
      tags: [Catalog]
      summary: Search master-data products
      description: |
        Products are master data: they exist whether or not they are on today's
        menu. For "what can I order now", use `GET /menus/today`.

        The structured attributes on each product — ingredients, spice level,
        tags — exist so a later search or recommendation feature has real data
        to work with instead of parsing prose out of a description.
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: category_id
          in: query
          description: Restrict to one category.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: q
          in: query
          description: Free-text match on name and description.
          schema:
            type: string
            maxLength: 120
        - name: tag
          in: query
          description: Repeatable. A product must carry every tag given.
          schema:
            type: array
            items:
              type: string
              maxLength: 40
            maxItems: 10
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /products/{product}:
    get:
      operationId: getProduct
      tags: [Catalog]
      summary: One product with variants and modifier groups
      security: []
      parameters:
        - name: product
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

  /menus/today:
    get:
      operationId: getTodayMenu
      tags: [Menu]
      summary: What is sellable now
      description: |
        The authoritative answer to "what can I order, at what price". Resolves
        the store's recurring weekday schedule, its time windows and any date
        exception in the store timezone, then returns the items live at `at`
        with their store price and availability.

        A client must never compute sellability itself from `GET /products`:
        schedule, sold-out state and daily quota all live here — and the server
        revalidates every one of them again at checkout, so a stale menu cannot
        turn into a wrongly priced order.
      security: []
      parameters:
        - name: at
          in: query
          description: |
            Evaluate the schedule at this instant instead of now. Sent in UTC;
            the server converts to store-local time. Intended for preorder
            screens, not for bypassing the current window.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The live menu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayMenu'
        '404':
          description: |
            No menu is scheduled for this store at that moment — a closed day or
            a holiday exception. The envelope carries `MENU_UNAVAILABLE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /carts:
    post:
      operationId: createCart
      tags: [Cart]
      summary: Open a cart
      description: |
        Creates an empty cart for the resolved store. Works for a guest and for
        a signed-in customer; the difference is only how it is addressed
        afterwards.

        A guest cart answers with a one-time `guest_token`. It is shown in this
        response and never again — only its hash is stored — and every later
        call on that cart must send it as `X-Guest-Cart-Token`. The cart id on
        its own is not enough: an id that leaked from a log or a shared link
        would otherwise hand over someone else's basket.

        Carts expire. `expires_at` is when this one stops accepting changes.
      security:
        - sanctumSession: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCartRequest'
      responses:
        '201':
          description: The new cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartCreated'
        '400':
          $ref: '#/components/responses/InvalidStoreContext'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /carts/{cart}:
    get:
      operationId: getCart
      tags: [Cart]
      summary: Read a cart with server-computed totals
      description: |
        Totals are computed by the server on every read, from the current menu
        price — not from whatever the client last saw. A price that moved since
        an item was added shows up here, before checkout, rather than as a
        surprise 409.
      security:
        - sanctumSession: []
        - guestCartToken: []
      parameters:
        - $ref: '#/components/parameters/CartPath'
      responses:
        '200':
          description: The cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: discardCart
      tags: [Cart]
      summary: Discard a cart
      description: |
        Abandons the cart and releases anything held for it. The row is kept in
        a discarded state rather than deleted, so an abandoned-basket report
        later has something to count.
      security:
        - sanctumSession: []
        - guestCartToken: []
      parameters:
        - $ref: '#/components/parameters/CartPath'
      responses:
        '204':
          description: Discarded.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The cart was already converted into an order and cannot be
            discarded. Carries `INVALID_STATE_TRANSITION`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /carts/{cart}/items:
    post:
      operationId: addCartItem
      tags: [Cart]
      summary: Add a line to the cart
      description: |
        The line references a **menu item**, not a product variant. The menu is
        what decides whether something is sellable at this store, in this time
        window, at which price — so taking the menu item as the input makes it
        impossible to order a variant that is not on the menu, or to be charged
        a master-data price that no store actually uses.

        Modifier selections are validated against the group rules
        (`min_select` / `max_select`, `required`) and against the menu's own
        price overrides for those options.

        No price is accepted from the client, here or anywhere else.
      security:
        - sanctumSession: []
        - guestCartToken: []
      parameters:
        - $ref: '#/components/parameters/CartPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '201':
          description: The cart, including the new line and fresh totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The item cannot be added as asked. `MENU_UNAVAILABLE` when it is not
            on the live menu, `OUT_OF_STOCK` when the remaining quota is smaller
            than the requested quantity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /carts/{cart}/items/{item}:
    patch:
      operationId: updateCartItem
      tags: [Cart]
      summary: Change quantity or note on a line
      description: |
        Modifier selections are not patchable: a different set of modifiers is a
        different line. Remove it and add the one that was meant, so the price
        is recomputed from scratch rather than adjusted in place.
      security:
        - sanctumSession: []
        - guestCartToken: []
      parameters:
        - $ref: '#/components/parameters/CartPath'
        - $ref: '#/components/parameters/CartItemPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: The cart with recomputed totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The new quantity exceeds what is left. Carries `OUT_OF_STOCK` with
            the remaining quantity in `details`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: removeCartItem
      tags: [Cart]
      summary: Remove a line
      security:
        - sanctumSession: []
        - guestCartToken: []
      parameters:
        - $ref: '#/components/parameters/CartPath'
        - $ref: '#/components/parameters/CartItemPath'
      responses:
        '200':
          description: The cart with recomputed totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /payment-methods:
    get:
      operationId: listPaymentMethods
      tags: [Payment]
      summary: Methods this store accepts
      description: |
        Only `CASH` and `BANK_TRANSFER` exist in MVP, and each can be switched
        off per store — with the constraint that a store can never have both
        off, or it could take no orders at all.

        A method that is listed but `enabled: false` is deliberate: the customer
        app can explain why a choice is greyed out instead of silently hiding
        it.
      security: []
      responses:
        '200':
          description: The store's payment methods.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethodOption'
        '400':
          $ref: '#/components/responses/InvalidStoreContext'

  /orders:
    post:
      operationId: createOrder
      tags: [Order]
      summary: Place an order
      description: |
        Converts a cart into an order. This is the one operation where the most
        can go wrong, so it is also the most defended:

        * **Revalidation.** Price, modifiers, menu schedule, availability and
          the chosen fulfillment rules are all recomputed from the server's own
          data. Anything the client believed is ignored; a disagreement is a
          409, not a silently different order.
        * **Idempotency.** `Idempotency-Key` is required. A retry with the same
          key replays the first outcome rather than placing a second order — the
          exact failure a timeout on a phone network would otherwise cause.
        * **Snapshots.** Every line stores its own name, variant, modifiers,
          unit price and totals. Editing a product tomorrow must never rewrite
          what someone agreed to pay today.
        * **Stock.** Quantities are taken under a database row lock, so two
          customers racing for the last portion cannot both win.

        A guest order answers with a one-time `guest_order_token`, needed for
        every later read of that order. An order is never addressable by id
        alone.

        The order's status and its payment's status are separate state machines.
        A `CASH` order is `PLACED` with payment `PENDING`, and stays that way
        until a cashier takes the money.
      security:
        - sanctumSession: []
        - guestCartToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: |
            The order, its payment instructions, and — for a guest — the access
            token for reading it later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreated'
        '400':
          $ref: '#/components/responses/InvalidStoreContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CheckoutConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /orders/{order}:
    get:
      operationId: getOrder
      tags: [Order]
      summary: Read an order
      description: |
        A signed-in customer reads their own orders through the session. A guest
        must send the `X-Guest-Order-Token` issued at checkout; the id alone is
        never enough.

        Includes the status history, so a customer app can show what happened
        and when without a second call.
      security:
        - sanctumSession: []
        - guestOrderToken: []
      parameters:
        - $ref: '#/components/parameters/OrderPath'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{order}/cancel:
    post:
      operationId: cancelOrder
      tags: [Order]
      summary: Cancel an order
      description: |
        Allowed only from the states a store has agreed a customer may cancel
        from — by default before `PREPARING`. Anything later is a conversation
        with the store, not an API call, so it answers 409 rather than
        pretending.

        Cancelling releases any stock reservation. It does **not** refund money:
        a bank transfer that has already arrived needs the exception handling in
        the reconciliation queue, not an automatic reversal.
      security:
        - sanctumSession: []
        - guestOrderToken: []
      parameters:
        - $ref: '#/components/parameters/OrderPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: The cancelled order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            This order cannot be cancelled from its current status. Carries
            `INVALID_STATE_TRANSITION` with the current status in `details`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /orders/{order}/payment:
    get:
      operationId: getOrderPayment
      tags: [Payment]
      summary: Payment state and instructions
      description: |
        For `BANK_TRANSFER`, returns the dynamic VietQR payload together with
        the receiving bank details, the exact amount and the unique transfer
        reference derived from the order code — everything a customer needs to
        pay, and everything staff need to recognise the credit afterwards.

        **A QR is not a receipt.** `status` stays `PENDING` until authorized
        staff confirm the real bank credit. There is no customer-facing way to
        move it, by design.

        For `CASH`, returns where and when to pay instead.
      security:
        - sanctumSession: []
        - guestOrderToken: []
      parameters:
        - $ref: '#/components/parameters/OrderPath'
      responses:
        '200':
          description: The payment, with method-specific instructions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPayment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: |
            The transfer window closed and the order expired. A transfer that
            arrives now is an exception for staff to handle, not a payment this
            endpoint will accept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /customer/orders:
    get:
      operationId: listOwnOrders
      tags: [Customer]
      summary: Own order history
      description: Signed-in customers only; guests have a token per order, not a history.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          description: Repeatable. Restrict to these order statuses.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: A page of the caller's orders, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /customer/profile:
    get:
      operationId: getOwnProfile
      tags: [Customer]
      summary: Own profile
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      operationId: updateOwnProfile
      tags: [Customer]
      summary: Update own profile
      description: |
        Changing the email does not change the login identity until the new
        address is verified, so this returns the profile with the pending
        address recorded separately rather than silently moving the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerProfileRequest'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /customer/addresses:
    get:
      operationId: listOwnAddresses
      tags: [Customer]
      summary: Saved delivery addresses
      x-provisional: true
      description: |
        Provisional: delivery is one of the fulfillment decisions still open in
        CLAUDE.md §15. The shape assumes a single free-text address line with a
        recipient and phone, which is what a Vietnamese delivery actually needs,
        rather than an anglophone street/city/postcode split.
      responses:
        '200':
          description: The caller's addresses, default first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerAddress'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createOwnAddress
      tags: [Customer]
      summary: Save an address
      x-provisional: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressRequest'
      responses:
        '201':
          description: The saved address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddress'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /customer/addresses/{address}:
    put:
      operationId: updateOwnAddress
      tags: [Customer]
      summary: Update a saved address
      x-provisional: true
      parameters:
        - $ref: '#/components/parameters/AddressPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressRequest'
      responses:
        '200':
          description: The updated address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddress'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: deleteOwnAddress
      tags: [Customer]
      summary: Forget a saved address
      x-provisional: true
      description: |
        Removes it from the caller's address book. Orders already placed to it
        keep their own snapshot, so history does not change retroactively.
      parameters:
        - $ref: '#/components/parameters/AddressPath'
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  # Every operation below checks TWO independent things: the caller's role grants
  # the permission named in the description, AND that grant applies to the store
  # being acted on. Store context comes from the route parameter, a configured
  # host mapping, or a verified single-store membership — never from a query
  # parameter. A client asking about a store it does not staff gets 404 or 403,
  # not data. Permission codes are the ones seeded by RolePermissionSeeder.

  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [Admin - Orders]
      summary: Operations queue
      description: |
        Permission `order.read`, scoped to the resolved store.

        The default sort is oldest-first among open orders, because this is a
        work queue and the oldest unserved order is the most urgent. Filtering
        by `status` is what turns it into a kitchen list, a pickup list, or a
        day's history.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          description: Repeatable. Restrict to these order statuses.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderStatus'
        - name: payment_status
          in: query
          description: Repeatable. Useful for finding unpaid cash orders.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PaymentStatus'
        - name: fulfillment_type
          in: query
          schema:
            $ref: '#/components/schemas/FulfillmentType'
        - name: placed_from
          in: query
          description: Inclusive lower bound on when the order was placed, UTC.
          schema:
            type: string
            format: date-time
        - name: placed_to
          in: query
          description: Exclusive upper bound, UTC.
          schema:
            type: string
            format: date-time
        - name: order_code
          in: query
          description: Exact match. What staff type when a customer reads a code aloud.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [oldest_first, newest_first]
            default: oldest_first
      responses:
        '200':
          description: A page of orders for this store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/orders/{order}:
    get:
      operationId: getAdminOrder
      tags: [Admin - Orders]
      summary: One order in full
      description: |
        Permission `order.read`. An order belonging to another store answers
        404, not 403 — otherwise the API would confirm that an id exists
        elsewhere.
      parameters:
        - $ref: '#/components/parameters/OrderPath'
      responses:
        '200':
          description: The order with items, payment and status history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/orders/{order}/status:
    post:
      operationId: transitionAdminOrder
      tags: [Admin - Orders]
      summary: Move an order to the next status
      description: |
        Permission `order.transition`; `KITCHEN_STAFF` additionally needs
        `kitchen.operate` for the preparation states.

        Only transitions the state machine allows are accepted, and every one is
        recorded in `order_status_history` with the actor and the reason. An
        invalid jump is a 409, never a quiet no-op.

        **Completing an order does not collect money.** Moving to `COMPLETED`
        leaves payment exactly as it was; an unpaid cash order stays unpaid
        until a cashier confirms it. Order status and payment status are two
        state machines on purpose, and this is the endpoint where conflating
        them would be most expensive.
      parameters:
        - $ref: '#/components/parameters/OrderPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionOrderRequest'
      responses:
        '200':
          description: The order at its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The state machine forbids this move. Carries
            `INVALID_STATE_TRANSITION` with the current and requested status in
            `details`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/payments:
    get:
      operationId: listAdminPayments
      tags: [Admin - Payments]
      summary: Reconciliation queue
      description: |
        Permission `payment.read`, scoped to the resolved store.

        This is the screen a cashier works from: bank transfers awaiting
        verification, cash awaiting collection, and the exceptions that MVP
        settlement inevitably produces — underpayment, overpayment, a missing or
        wrong transfer reference, a duplicate transfer, money that arrived after
        the order expired.

        `needs_attention` is the useful default filter: everything that a human
        has to look at, rather than everything that exists.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          description: Repeatable.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PaymentStatus'
        - name: method
          in: query
          schema:
            $ref: '#/components/schemas/PaymentMethod'
        - name: needs_attention
          in: query
          description: |
            Only payments a human must act on: pending within the transfer
            window, or carrying a recorded discrepancy.
          schema:
            type: boolean
        - name: transfer_reference
          in: query
          description: Exact match. What staff paste from a bank statement line.
          schema:
            type: string
      responses:
        '200':
          description: A page of payments for this store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPaymentPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/payments/{payment}:
    get:
      operationId: getAdminPayment
      tags: [Admin - Payments]
      summary: One payment with its event history
      description: |
        Permission `payment.read`. Includes every status change with its actor,
        and any recorded bank transactions, so a disputed payment can be
        reconstructed rather than argued about.
      parameters:
        - $ref: '#/components/parameters/PaymentPath'
      responses:
        '200':
          description: The payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPayment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/payments/{payment}/confirm:
    post:
      operationId: confirmAdminPayment
      tags: [Admin - Payments]
      summary: Record that the money actually arrived
      description: |
        Permission `payment.confirm`. `CASHIER` and above; never the customer.

        This is the only way a payment becomes `PAID`, and it is a statement of
        fact by a named person: they have seen the cash, or seen the credit on
        the real bank account. A screenshot, a QR having been displayed, or a
        customer pressing "I have transferred" are none of them evidence, and
        there is deliberately no endpoint through which they could be.

        Transactional and idempotent. `Idempotency-Key` is required, so a
        double-click or a retried request cannot record two collections of the
        same money. A second confirmation of an already-confirmed payment
        answers 409 `PAYMENT_ALREADY_CONFIRMED`.

        **Amount mismatch is not auto-resolved.** If `amount` differs from what
        the order is owed, the request is rejected with
        `PAYMENT_AMOUNT_MISMATCH` unless `accept_discrepancy` is set, in which
        case the difference is recorded as an explicit exception with the
        actor's reason. Under- and overpayment are business decisions, not
        rounding.

        Writes an audit record with the actor, timestamp, amount and any bank
        reference.
      parameters:
        - $ref: '#/components/parameters/PaymentPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '200':
          description: The payment, now `PAID`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPayment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PaymentConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/payments/{payment}/flag:
    post:
      operationId: flagAdminPayment
      tags: [Admin - Payments]
      summary: Record an exception without confirming payment
      description: |
        Permission `payment.confirm`.

        For the cases that must not be forced into `PAID` or `FAILED`: a
        transfer with no recognisable reference, a duplicate credit, money that
        landed after the order was cancelled. The payment keeps its status and
        gains a documented discrepancy, so it stays in the queue with an
        explanation instead of being closed to make the list shorter.

        Resolution — refund, manual match, or writing it off — is a store policy
        decision that CLAUDE.md §15 still leaves open, so no endpoint pretends
        to automate it.
      x-provisional: true
      parameters:
        - $ref: '#/components/parameters/PaymentPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagPaymentRequest'
      responses:
        '200':
          description: The payment with the recorded discrepancy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPayment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/stores/{store}/bank-account:
    get:
      operationId: getStoreBankAccount
      tags: [Admin - Store]
      summary: Where transfers are received
      description: |
        Permission `payment.bank-account.manage` — deliberately an owner-level
        grant. `STORE_MANAGER` does not have it, because changing where money
        lands is not a day-to-day operational action.

        The account number is returned masked. The full value is never needed by
        a UI that only has to show which account is configured, and a masked
        read keeps it out of screenshots, support tickets and browser caches.
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '200':
          description: The configured account, masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreBankAccount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '404':
          description: No bank account is configured for this store yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: updateStoreBankAccount
      tags: [Admin - Store]
      summary: Set the receiving account
      description: |
        Permission `payment.bank-account.manage`.

        Validates the bank identifier against the known VietQR BIN list and the
        account number against that bank's format, because a typo here does not
        fail loudly — it silently sends customers' money somewhere else.

        Every change is audited with the actor, the previous value and the new
        one. Customers never see this endpoint and can never reach bank-account
        management.
      parameters:
        - $ref: '#/components/parameters/StorePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreBankAccountRequest'
      responses:
        '200':
          description: The updated account, masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreBankAccount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/stores/{store}/payment-methods:
    put:
      operationId: updateStorePaymentMethods
      tags: [Admin - Store]
      summary: Enable or disable the two MVP methods
      description: |
        Permission `store.update`.

        Rejects any combination that would leave the store with no usable
        method — a store that accepts neither cash nor transfer cannot take an
        order at all. Enabling `BANK_TRANSFER` without a configured bank account
        is refused for the same reason.
      parameters:
        - $ref: '#/components/parameters/StorePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStorePaymentMethodsRequest'
      responses:
        '200':
          description: The store's methods after the change.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethodOption'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '422':
          description: |
            The change would leave no usable payment method, or enables transfer
            with no bank account configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /admin/menus:
    get:
      operationId: listAdminMenus
      tags: [Admin - Menu]
      summary: Menus for this store
      description: Permission `menu.read`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of menus.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'

  /admin/menus/{menu}:
    get:
      operationId: getAdminMenu
      tags: [Admin - Menu]
      summary: One menu with schedules, exceptions and priced items
      description: Permission `menu.read`.
      parameters:
        - $ref: '#/components/parameters/MenuPath'
      responses:
        '200':
          description: The menu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateAdminMenu
      tags: [Admin - Menu]
      summary: Replace a menu's items and schedule
      description: |
        Permission `menu.manage`.

        A full replacement rather than a patch: a menu is a set, and "these are
        the items and these are the windows" is both easier to reason about and
        safer than a sequence of partial edits that could leave the menu in a
        state nobody intended.

        Overlapping windows for the same weekday are rejected — two prices for
        one moment has no correct answer. Prices are per store; master-data
        prices in the catalog are a default, not what a customer pays.

        Changing a menu never touches orders already placed: those carry their
        own snapshots.
      parameters:
        - $ref: '#/components/parameters/MenuPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuRequest'
      responses:
        '200':
          description: The updated menu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Validation failed, including overlapping schedule windows for one
            weekday.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /admin/menu-items/{menuItem}/availability:
    put:
      operationId: updateMenuItemAvailability
      tags: [Admin - Menu]
      summary: Mark sold out, or set today's remaining quota
      description: |
        Permission `menu.manage`, or `kitchen.operate` for kitchen staff — this
        is the single most-used action in a working kitchen and must not need a
        manager.

        Separate from the menu replacement above on purpose: running out of pork
        at 08:40 is a one-field operational fact, not a menu redesign, and
        making staff submit a whole menu to express it would guarantee mistakes.
      parameters:
        - name: menuItem
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuItemAvailabilityRequest'
      responses:
        '200':
          description: The updated menu item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [Admin - Catalog]
      summary: Master-data products, including inactive ones
      description: |
        Permission `catalog.read`. Unlike the public list, this includes drafts
        and archived products, because managing them is the point.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CatalogStatus'
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
    post:
      operationId: createAdminProduct
      tags: [Admin - Catalog]
      summary: Create a product with its variants
      description: |
        Permission `catalog.manage`.

        Catalog is **platform master data, not store data**: creating a product
        does not put it on sale anywhere. A menu does that. This is what keeps
        the model general enough for packaged goods and retail, where there is
        no menu and no kitchen at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: The created product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/products/{product}:
    put:
      operationId: updateAdminProduct
      tags: [Admin - Catalog]
      summary: Update a product
      description: |
        Permission `catalog.manage`.

        Renaming or repricing a product changes what is offered from now on. It
        never rewrites an order: order lines hold their own snapshot of name,
        variant, modifiers and price precisely so yesterday's receipt stays
        true.
      parameters:
        - name: product
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: The updated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/stock-items:
    get:
      operationId: listAdminStockItems
      tags: [Admin - Inventory]
      summary: Daily portions for a service date
      x-provisional: true
      description: |
        Permission `inventory.read`.

        Provisional: whether stock is counted per finished product or per
        ingredient is still open in CLAUDE.md §15, and the two models differ
        enough that this shape will change if ingredient-level counting wins.
        What is designed here is the finished-product model — a capacity per
        variant per service date — because that is what a breakfast shop
        actually tracks, and it is the smaller of the two to migrate away from.

        `reserved_quantity` and `sold_quantity` are reported separately from
        `capacity` so staff can see the difference between "promised" and
        "gone".
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: service_date
          in: query
          required: true
          description: Store-local calendar date, not UTC.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: A page of stock items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItemPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/stock-items/{stockItem}:
    put:
      operationId: updateAdminStockItem
      tags: [Admin - Inventory]
      summary: Set the capacity for one variant on one day
      x-provisional: true
      description: |
        Permission `inventory.manage`.

        Capacity is set, never decremented from here: the server owns the
        arithmetic of reservations and sales, and letting a client post a
        decrement would reintroduce exactly the lost-update race the row locking
        exists to prevent.

        Lowering capacity below what is already reserved is refused rather than
        silently cancelling someone's order.
      parameters:
        - name: stockItem
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStockItemRequest'
      responses:
        '200':
          description: The updated stock item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/StoreScopeDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The new capacity is below the quantity already reserved or sold.
            Carries `OUT_OF_STOCK` with both numbers in `details`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'

components:

  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: smart-commerce-platform-session
      description: |
        Laravel Sanctum first-party cookie session. The cookie name is derived
        from `APP_NAME`, so it differs per deployment; `SESSION_COOKIE` sets it
        explicitly.

        A cookie alone is not sufficient: state-changing requests must also send
        `X-XSRF-TOKEN`, obtained from `GET /sanctum/csrf-cookie`. OpenAPI cannot
        express "cookie plus CSRF header" as one scheme, so the CSRF half is
        documented rather than modelled. The origin must appear in both
        `SANCTUM_STATEFUL_DOMAINS` and `CORS_ALLOWED_ORIGINS`, and credentialed
        CORS makes a wildcard origin impossible by construction.
    guestCartToken:
      type: apiKey
      in: header
      name: X-Guest-Cart-Token
      description: |
        One-time token returned by `POST /carts` for a guest cart. Only its hash
        is stored, so it cannot be recovered — a client that loses it starts a
        new cart.
    guestOrderToken:
      type: apiKey
      in: header
      name: X-Guest-Order-Token
      description: |
        Scoped token returned by `POST /orders` for a guest order, and the only
        way a guest can read it afterwards. Orders are never addressable by id
        alone, so a leaked id does not expose a customer's name, phone or
        delivery address.

  headers:
    XRequestId:
      description: |
        Correlation id, echoed on every response and present in logs and audit
        rows. An inbound value is reused only when it matches
        `[A-Za-z0-9._:-]{1,128}`; anything else is replaced rather than
        reflected.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1

  parameters:
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque cursor from a previous page's `next_cursor`. Not a page number
        and not an offset: offset pagination drifts and degrades on tables that
        are written to constantly, which is every table that matters here.
      schema:
        type: string
        maxLength: 500
    Limit:
      name: limit
      in: query
      description: Page size. Clamped server-side to the documented maximum.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated key, unique per intended operation. A retry with the
        same key replays the stored outcome instead of performing the operation
        again; the same key with a different payload is a client bug and answers
        409 `IDEMPOTENCY_KEY_REUSED`.

        Use a UUID. Reusing a key across different operations defeats the point.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    StorePath:
      name: store
      in: path
      required: true
      description: Store id. The store scope is checked against membership, not trusted.
      schema:
        $ref: '#/components/schemas/Uuid'
    CartPath:
      name: cart
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CartItemPath:
      name: item
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    OrderPath:
      name: order
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PaymentPath:
      name: payment
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MenuPath:
      name: menu
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AddressPath:
      name: address
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'

  responses:
    Unauthenticated:
      description: |
        No valid session or guest token. Returned with the error envelope
        regardless of the `Accept` header: an API has no login page to redirect
        to.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status_code: 401
            code: UNAUTHENTICATED
            message: Authentication required
            request_id: 7edfcb93479ad48b9f0cf5ebc538fe22
            timestamp: '2026-11-11T02:14:07Z'
            path: /api/v1/me
    StoreScopeDenied:
      description: |
        Authenticated, but the grant does not reach this store, or the role
        lacks the permission. `FORBIDDEN` when the permission is missing
        outright, `STORE_SCOPE_DENIED` when the permission exists but not for
        this store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: |
        No such resource — or it exists and belongs to another store. The two
        are deliberately indistinguishable, so the API cannot be used to
        enumerate other stores' objects.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidStoreContext:
      description: |
        The store could not be resolved from the route, the host mapping or a
        single-store default. A client cannot fix this by supplying a store id:
        store context is never read from a query parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: The request parsed but is semantically invalid. `details` is per field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status_code: 422
            code: VALIDATION_FAILED
            message: The request is invalid
            details:
              - field: items.0.quantity
                message: Quantity must be at least 1
            request_id: 0f8d2c7a4b1e4f9a8c3d2e1f0a9b8c7d
            timestamp: '2026-11-11T02:14:07Z'
            path: /api/v1/carts/0193f0.../items
    RateLimited:
      description: Too many requests. Shed by the gateway or by a named Laravel limiter.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CheckoutConflict:
      description: |
        Checkout revalidation disagreed with what the client believed, or the
        same idempotency key is in play. One of:

        | `code`                   | Meaning                                              |
        | ------------------------ | ---------------------------------------------------- |
        | `PRICE_CHANGED`          | The menu price moved since the cart was priced        |
        | `OUT_OF_STOCK`           | Not enough remains for one or more lines              |
        | `MENU_UNAVAILABLE`       | An item is no longer on the live menu                 |
        | `IDEMPOTENCY_KEY_REUSED` | Same key, different payload                           |
        | `REQUEST_IN_PROGRESS`    | Same key, still running — retry, do not change the key |
        | `INVALID_STATE_TRANSITION` | The cart was already converted                      |

        `details` names the offending line so a client can show it rather than
        asking the customer to start again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status_code: 409
            code: OUT_OF_STOCK
            message: Not enough stock remains for this item
            details:
              - field: items.0.quantity
                message: only 2 remain
            request_id: f308e2ece422b61a6b0f154d5b144444
            timestamp: '2026-11-11T02:14:07Z'
            path: /api/v1/orders
    PaymentConflict:
      description: |
        `PAYMENT_ALREADY_CONFIRMED` when this payment is already `PAID`;
        `PAYMENT_AMOUNT_MISMATCH` when the recorded amount differs from what the
        order is owed and `accept_discrepancy` was not set;
        `IDEMPOTENCY_KEY_REUSED` or `REQUEST_IN_PROGRESS` for key problems.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:

    Uuid:
      type: string
      format: uuid
      description: UUIDv7 — time-ordered, so it indexes well and sorts usefully.
      examples: ['0193f0a2-6f3b-7c21-9a44-2f1c8e7b5d90']

    Money:
      type: object
      description: |
        A monetary amount. Always an object, never a bare number: an amount
        without its currency invites a client to format it wrongly, and a JSON
        number cannot hold 64-bit đồng safely in every runtime.
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+$'
          description: Whole đồng as a decimal string. Never parse into a float.
          examples: ['45000']
        currency:
          type: string
          enum: [VND]

    ErrorCode:
      type: string
      description: |
        Stable, machine-readable reason. The HTTP status carries the class of
        failure; this carries the reason. Adding a case is a compatible change;
        repurposing one is breaking.
      enum:
        - VALIDATION_FAILED
        - INVALID_STORE_CONTEXT
        - UNAUTHENTICATED
        - FORBIDDEN
        - STORE_SCOPE_DENIED
        - RESOURCE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - IDEMPOTENCY_KEY_REUSED
        - REQUEST_IN_PROGRESS
        - INVALID_STATE_TRANSITION
        - OUT_OF_STOCK
        - PRICE_CHANGED
        - MENU_UNAVAILABLE
        - PAYMENT_ALREADY_CONFIRMED
        - PAYMENT_AMOUNT_MISMATCH
        - RATE_LIMITED
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE

    ErrorDetail:
      type: object
      required: [field, message]
      additionalProperties: false
      properties:
        field:
          type: string
          description: Dot path into the request payload.
          examples: ['items.0.quantity']
        message:
          type: string

    ErrorEnvelope:
      type: object
      description: |
        The single shape every failure takes. Stack traces, SQL, credentials and
        payment payloads never appear; `debug` is present only when `APP_DEBUG`
        is on and only for genuinely unexpected errors.
      required: [status_code, code, message, request_id, timestamp, path]
      properties:
        status_code:
          type: integer
          description: Repeats the HTTP status, so a logged body is self-contained.
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable. Never branch on this.
        details:
          type: array
          description: Present for validation failures and some conflicts.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
          description: Matches `X-Request-Id`; quote it in a support request.
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        debug:
          type: object
          description: Non-production only.
          additionalProperties: true

    PageMeta:
      type: object
      description: |
        Cursor pagination envelope shared by every list endpoint. `next_cursor`
        is null exactly when `has_more` is false.
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean

    OrderStatus:
      type: string
      description: |
        Order lifecycle. A separate state machine from `PaymentStatus`:
        `COMPLETED` never implies `PAID`.

        Default prepaid path:
        `PENDING_PAYMENT → PLACED → CONFIRMED → PREPARING → READY → COMPLETED`.
        Cash orders start at `PLACED` and may progress before payment.
        `CANCELLED` and `EXPIRED` are reachable under explicit rules only.
      enum:
        - PENDING_PAYMENT
        - PLACED
        - CONFIRMED
        - PREPARING
        - READY
        - COMPLETED
        - CANCELLED
        - EXPIRED

    PaymentStatus:
      type: string
      description: |
        Payment lifecycle, independent of order status. Only authorized staff
        move a payment to `PAID`, and only after seeing the real money.
      enum: [PENDING, PROCESSING, PAID, FAILED, PARTIALLY_REFUNDED, REFUNDED]

    PaymentMethod:
      type: string
      description: |
        Fixed MVP scope. Gateways, cards and automatic bank reconciliation are
        out of scope until separately approved — this enum is deliberately not
        open-ended.
      enum: [CASH, BANK_TRANSFER]

    FulfillmentType:
      type: string
      description: |
        Dine-in QR ordering is not in MVP, and appointment-based services need
        their own booking model entirely.
      enum: [PICKUP, DELIVERY]

    FulfillmentStatus:
      type: string
      enum: [PENDING, PREPARING, READY, DISPATCHED, DELIVERED, CANCELLED]

    CatalogStatus:
      type: string
      description: Master-data lifecycle. `ARCHIVED` keeps history readable.
      enum: [DRAFT, ACTIVE, ARCHIVED]

    AdminRole:
      type: string
      enum: [SUPER_ADMIN, STORE_OWNER, STORE_MANAGER, CASHIER, KITCHEN_STAFF]

    ApiMetadata:
      type: object
      required: [name, api_version, request_id]
      properties:
        name:
          type: string
        api_version:
          type: string
          const: v1
        request_id:
          type: string

    CurrentUser:
      type: object
      description: |
        The authenticated principal. `store_memberships` is what the admin app
        uses to decide which stores a user may act in; it is informational, and
        the server re-checks scope on every request regardless.
      required: [id, name, email, roles, store_memberships]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: [string, 'null']
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AdminRole'
        store_memberships:
          type: array
          items:
            type: object
            required: [store_id, store_name, role, status]
            properties:
              store_id:
                $ref: '#/components/schemas/Uuid'
              store_name:
                type: string
              role:
                $ref: '#/components/schemas/AdminRole'
              status:
                type: string
                enum: [ACTIVE, SUSPENDED]
        permissions:
          type: array
          description: Effective permission codes in the resolved store context.
          items:
            type: string
            examples: ['payment.confirm']

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 255
        remember:
          type: boolean
          default: false

    Store:
      type: object
      description: |
        `timezone` is per store and defaults to `Asia/Ho_Chi_Minh`. Every
        timestamp in this API is UTC; schedules are evaluated in store-local
        time on the server. A client that compares its own clock against opening
        hours will be wrong for any customer travelling or with a misconfigured
        device.
      required: [id, name, slug, status, timezone, currency, fulfillment_types, hours]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        timezone:
          type: string
          examples: ['Asia/Ho_Chi_Minh']
        currency:
          type: string
          enum: [VND]
        phone:
          type: [string, 'null']
        address_line:
          type: [string, 'null']
        fulfillment_types:
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentType'
        hours:
          type: array
          items:
            $ref: '#/components/schemas/StoreHours'
        closures:
          type: array
          description: Known exceptions ahead of time — holidays, one-off closures.
          items:
            $ref: '#/components/schemas/StoreClosure'
        is_open_now:
          type: boolean
          description: Server-evaluated, in store-local time. Authoritative.

    StoreHours:
      type: object
      required: [day_of_week, is_closed]
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday, matching PostgreSQL `EXTRACT(DOW)`.
        opens_at:
          type: [string, 'null']
          pattern: '^[0-2][0-9]:[0-5][0-9]$'
          description: Store-local wall clock, not UTC.
        closes_at:
          type: [string, 'null']
          pattern: '^[0-2][0-9]:[0-5][0-9]$'
        is_closed:
          type: boolean

    StoreClosure:
      type: object
      required: [date, reason]
      properties:
        date:
          type: string
          format: date
        reason:
          type: string

    Category:
      type: object
      required: [id, name, slug, sort_order]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        parent_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        name:
          type: string
        slug:
          type: string
        sort_order:
          type: integer

    CategoryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Category'

    ProductAttributes:
      type: object
      description: |
        Structured, not prose. A later search, filter or recommendation feature
        needs to read "contains peanuts" as data; parsing it back out of a
        description would be guesswork. Also why spice level is a number rather
        than an adjective.
      properties:
        ingredients:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            type: string
        spice_level:
          type: [integer, 'null']
          minimum: 0
          maximum: 5
        tags:
          type: array
          items:
            type: string
        dietary:
          type: array
          items:
            type: string
            enum: [VEGETARIAN, VEGAN, HALAL, GLUTEN_FREE]

    ModifierOption:
      type: object
      description: |
        `price_delta` is the master-data default. A menu may override it per
        store, and the menu's value is what a customer pays.
      required: [id, name, price_delta, status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        price_delta:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/CatalogStatus'

    ModifierGroup:
      type: object
      description: |
        `min_select` and `max_select` are enforced server-side at add-to-cart
        and again at checkout. A client may mirror them for a better form, but
        must not rely on having done so.
      required: [id, name, min_select, max_select, required, options]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        min_select:
          type: integer
          minimum: 0
        max_select:
          type: integer
          minimum: 1
        required:
          type: boolean
          description: Per product, from the product–group join, not the group itself.
        sort_order:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/ModifierOption'

    ProductVariant:
      type: object
      required: [id, name, base_price, status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        sku:
          type: [string, 'null']
        name:
          type: string
        base_price:
          $ref: '#/components/schemas/Money'
          description: Master-data default. Store price lives on the menu item.
        status:
          $ref: '#/components/schemas/CatalogStatus'

    Product:
      type: object
      required: [id, name, slug, status, inventory_tracking, variants]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/CatalogStatus'
        inventory_tracking:
          type: boolean
          description: |
            Whether this product is counted at all. A bottled drink with no
            daily limit is tracked differently from a dish with twenty portions,
            and a retail catalogue may not need counting here at all.
        image_url:
          type: [string, 'null']
          format: uri
        attributes:
          $ref: '#/components/schemas/ProductAttributes'
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductVariant'
        modifier_groups:
          type: array
          items:
            $ref: '#/components/schemas/ModifierGroup'

    ProductPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Product'

    ProductRequest:
      type: object
      required: [name, status, variants]
      additionalProperties: false
      properties:
        category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          maxLength: 160
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/CatalogStatus'
        inventory_tracking:
          type: boolean
          default: true
        attributes:
          $ref: '#/components/schemas/ProductAttributes'
        variants:
          type: array
          minItems: 1
          description: |
            A full replacement of the variant set. A variant referenced by a
            menu or by order history cannot be removed, only archived.
          items:
            type: object
            required: [name, base_price_amount, status]
            additionalProperties: false
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              sku:
                type: [string, 'null']
                maxLength: 64
              name:
                type: string
                maxLength: 160
              base_price_amount:
                type: string
                pattern: '^[0-9]+$'
                description: Whole đồng as a string. Currency is the store's; VND in MVP.
              status:
                $ref: '#/components/schemas/CatalogStatus'
        modifier_group_ids:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'

    MenuItem:
      type: object
      description: |
        A product variant offered on a menu, at this store's price. This — not
        the variant — is what a cart line references.
      required: [id, product, variant, price, is_available]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        product:
          type: object
          required: [id, name, slug]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            name:
              type: string
            slug:
              type: string
            description:
              type: [string, 'null']
            image_url:
              type: [string, 'null']
              format: uri
            attributes:
              $ref: '#/components/schemas/ProductAttributes'
        variant:
          type: object
          required: [id, name]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            name:
              type: string
            sku:
              type: [string, 'null']
        price:
          $ref: '#/components/schemas/Money'
          description: What a customer pays at this store. Overrides the variant default.
        is_available:
          type: boolean
          description: Staff-controlled sold-out switch, independent of quota.
        available_quantity:
          type: [integer, 'null']
          minimum: 0
          description: |
            Portions left today, or null when this item is not counted.
            Advisory: the authoritative check happens under a row lock at
            checkout, so a client must handle `OUT_OF_STOCK` even when this
            number looked sufficient.
          x-provisional: true
        sort_order:
          type: integer
        modifier_groups:
          type: array
          description: With any menu-specific price overrides already applied.
          items:
            $ref: '#/components/schemas/ModifierGroup'

    TodayMenu:
      type: object
      required: [store_id, menu_id, name, service_date, timezone, items]
      properties:
        store_id:
          $ref: '#/components/schemas/Uuid'
        menu_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: ['Bữa sáng']
        service_date:
          type: string
          format: date
          description: Store-local calendar date, which is not always the UTC date.
        timezone:
          type: string
        served_from:
          type: [string, 'null']
          format: date-time
          description: Start of the current window, UTC.
        served_until:
          type: [string, 'null']
          format: date-time
        preorder:
          type: object
          description: When a future window may be ordered ahead of time.
          x-provisional: true
          properties:
            enabled:
              type: boolean
            cutoff_at:
              type: [string, 'null']
              format: date-time
            earliest_slot_at:
              type: [string, 'null']
              format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'

    MenuSchedule:
      type: object
      description: |
        One recurring weekday window. Two windows on the same weekday may not
        overlap: a single moment with two prices has no correct answer.
      required: [day_of_week, start_time, end_time]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        start_time:
          type: string
          pattern: '^[0-2][0-9]:[0-5][0-9]$'
        end_time:
          type: string
          pattern: '^[0-2][0-9]:[0-5][0-9]$'
        valid_from:
          type: [string, 'null']
          format: date
        valid_to:
          type: [string, 'null']
          format: date

    MenuException:
      type: object
      description: A single date that overrides the recurring schedule.
      required: [exception_date, action]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        exception_date:
          type: string
          format: date
        action:
          type: string
          enum: [CLOSED, OPEN]
        start_time:
          type: [string, 'null']
          pattern: '^[0-2][0-9]:[0-5][0-9]$'
        end_time:
          type: [string, 'null']
          pattern: '^[0-2][0-9]:[0-5][0-9]$'

    Menu:
      type: object
      required: [id, store_id, name, status, schedules, items]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        store_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/MenuSchedule'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/MenuException'
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'

    MenuPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Menu'

    UpdateMenuRequest:
      type: object
      required: [name, status, schedules, items]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 160
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/MenuSchedule'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/MenuException'
        items:
          type: array
          description: The complete item set. Anything omitted is removed from the menu.
          items:
            type: object
            required: [variant_id, selling_price_amount]
            additionalProperties: false
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              variant_id:
                $ref: '#/components/schemas/Uuid'
              selling_price_amount:
                type: string
                pattern: '^[0-9]+$'
              is_available:
                type: boolean
                default: true
              sort_order:
                type: integer
              modifier_price_overrides:
                type: array
                items:
                  type: object
                  required: [modifier_option_id, price_delta_amount]
                  additionalProperties: false
                  properties:
                    modifier_option_id:
                      $ref: '#/components/schemas/Uuid'
                    price_delta_amount:
                      type: string
                      pattern: '^-?[0-9]+$'

    UpdateMenuItemAvailabilityRequest:
      type: object
      required: [is_available]
      additionalProperties: false
      properties:
        is_available:
          type: boolean
        available_quantity:
          type: [integer, 'null']
          minimum: 0
          description: |
            Today's remaining portions, or null to stop counting this item.
            Rejected when lower than what is already reserved.
          x-provisional: true

    CreateCartRequest:
      type: object
      additionalProperties: false
      description: |
        No `store_id`: store context is resolved from the host mapping or the
        single-store default, never from client input.
      properties:
        fulfillment_type:
          $ref: '#/components/schemas/FulfillmentType'
          description: Intended at open time. Confirmed and revalidated at checkout.

    CartCreated:
      type: object
      required: [cart]
      properties:
        cart:
          $ref: '#/components/schemas/Cart'
        guest_token:
          type: [string, 'null']
          description: |
            Shown once, for a guest cart only. Store it client-side and send it
            as `X-Guest-Cart-Token`; only its hash is kept server-side, so it
            cannot be re-issued.

    CartItemModifier:
      type: object
      required: [modifier_option_id, name, quantity, unit_price_delta]
      properties:
        modifier_option_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price_delta:
          $ref: '#/components/schemas/Money'

    CartItem:
      type: object
      required: [id, menu_item_id, product_name, variant_name, quantity, unit_price, line_total]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        menu_item_id:
          $ref: '#/components/schemas/Uuid'
        product_name:
          type: string
        variant_name:
          type: string
        quantity:
          type: integer
          minimum: 1
        note:
          type: [string, 'null']
        unit_price:
          $ref: '#/components/schemas/Money'
        modifiers_total:
          $ref: '#/components/schemas/Money'
        line_total:
          $ref: '#/components/schemas/Money'
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/CartItemModifier'
        is_available:
          type: boolean
          description: |
            False when this line is no longer sellable — off the menu, or sold
            out. Surfaced on read so the customer finds out before checkout
            rather than through a 409.

    CartTotals:
      type: object
      description: |
        Recomputed by the server on every read and again at checkout. A client
        must display these, never derive its own: VND has no sub-unit, so a
        client rounding a float would produce a total the server disagrees with.
      required: [subtotal, discount, total]
      properties:
        subtotal:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        delivery_fee:
          $ref: '#/components/schemas/Money'
          description: Zero for pickup. Fee rules are still open in §15.
        tax:
          $ref: '#/components/schemas/Money'
          description: Zero until tax rules are decided (§15).
        total:
          $ref: '#/components/schemas/Money'

    Cart:
      type: object
      required: [id, store_id, status, items, totals]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        store_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [OPEN, CONVERTED, DISCARDED, EXPIRED]
        fulfillment_type:
          oneOf:
            - $ref: '#/components/schemas/FulfillmentType'
            - type: 'null'
        expires_at:
          type: [string, 'null']
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        totals:
          $ref: '#/components/schemas/CartTotals'

    SelectedModifierRequest:
      type: object
      required: [modifier_option_id]
      additionalProperties: false
      properties:
        modifier_option_id:
          $ref: '#/components/schemas/Uuid'
        quantity:
          type: integer
          minimum: 1
          default: 1

    AddCartItemRequest:
      type: object
      required: [menu_item_id, quantity]
      additionalProperties: false
      description: |
        No price field, deliberately. Accepting a price from a client — even to
        "confirm" it — creates a path where a tampered request decides what
        something costs.
      properties:
        menu_item_id:
          $ref: '#/components/schemas/Uuid'
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        note:
          type: [string, 'null']
          maxLength: 255
        modifiers:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SelectedModifierRequest'

    UpdateCartItemRequest:
      type: object
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        note:
          type: [string, 'null']
          maxLength: 255

    PaymentMethodOption:
      type: object
      required: [method, enabled, label]
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        enabled:
          type: boolean
        label:
          type: string
        description:
          type: [string, 'null']
        unavailable_reason:
          type: [string, 'null']
          description: Why it is off, when it is — so the UI can explain rather than hide.

    OrderContact:
      type: object
      description: |
        Who to call when the order is ready. Required for a guest; defaulted
        from the profile for a signed-in customer, and overridable because the
        person collecting is not always the person who ordered.

        Whether a guest phone number must be verified by OTP is open in §15. The
        contract is shaped so adding verification later does not change this
        payload — only whether it is accepted without a verification token.
      required: [name, phone]
      additionalProperties: false
      x-provisional: true
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          description: Vietnamese mobile number, normalised server-side.
          maxLength: 20
        email:
          type: [string, 'null']
          format: email
          maxLength: 254

    OrderDelivery:
      type: object
      description: |
        Required when `fulfillment_type` is `DELIVERY`. Either a saved address
        id, or a one-off address for a guest — never both.
      additionalProperties: false
      x-provisional: true
      properties:
        address_id:
          $ref: '#/components/schemas/Uuid'
        address:
          type: object
          required: [recipient_name, phone, address_line]
          additionalProperties: false
          properties:
            recipient_name:
              type: string
              maxLength: 120
            phone:
              type: string
              maxLength: 20
            address_line:
              type: string
              maxLength: 500
            note:
              type: [string, 'null']
              maxLength: 255
      oneOf:
        - required: [address_id]
        - required: [address]

    CreateOrderRequest:
      type: object
      required: [cart_id, fulfillment_type, payment_method, contact]
      additionalProperties: false
      properties:
        cart_id:
          $ref: '#/components/schemas/Uuid'
        fulfillment_type:
          $ref: '#/components/schemas/FulfillmentType'
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        contact:
          $ref: '#/components/schemas/OrderContact'
        delivery:
          $ref: '#/components/schemas/OrderDelivery'
        scheduled_at:
          type: [string, 'null']
          format: date-time
          description: |
            Requested collection or delivery time, UTC. Must fall inside a
            schedulable window and after any preorder cutoff; both are checked
            server-side.
        note:
          type: [string, 'null']
          maxLength: 500
        expected_total_amount:
          type: [string, 'null']
          pattern: '^[0-9]+$'
          description: |
            Optional. What the client last showed the customer. When present and
            different from the server's total, checkout fails with
            `PRICE_CHANGED` instead of charging a number the customer never
            agreed to. It is a consent check, never an input to pricing.

    OrderItemModifier:
      type: object
      description: Snapshot. The option may be renamed or deleted later; this will not change.
      required: [option_name, unit_price_delta, quantity]
      properties:
        modifier_option_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        option_name:
          type: string
        unit_price_delta:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
          minimum: 1

    OrderItem:
      type: object
      description: |
        An immutable snapshot of what was agreed: names, modifiers and prices as
        they were at checkout. Nothing here is a live reference, which is why
        editing the catalogue tomorrow cannot change a receipt from today.
      required: [id, product_name, variant_name, quantity, unit_price, line_total]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        product_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        variant_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        product_name:
          type: string
        variant_name:
          type: string
        quantity:
          type: integer
          minimum: 1
        note:
          type: [string, 'null']
        unit_price:
          $ref: '#/components/schemas/Money'
        modifiers_total:
          $ref: '#/components/schemas/Money'
        line_total:
          $ref: '#/components/schemas/Money'
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemModifier'

    OrderTotals:
      type: object
      required: [subtotal, discount, total]
      properties:
        subtotal:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        delivery_fee:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
          description: Zero until tax rules are decided (§15).
        total:
          $ref: '#/components/schemas/Money'

    OrderStatusChange:
      type: object
      required: [to_status, created_at]
      properties:
        from_status:
          oneOf:
            - $ref: '#/components/schemas/OrderStatus'
            - type: 'null'
        to_status:
          $ref: '#/components/schemas/OrderStatus'
        actor_name:
          type: [string, 'null']
          description: Null when the system made the move, for example on expiry.
        reason:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time

    PaymentSummary:
      type: object
      description: |
        The payment's own state. Never inferred from the order's status: an
        order can be `COMPLETED` with payment still `PENDING`, which is exactly
        what an uncollected cash order is.
      required: [id, method, status, amount]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          $ref: '#/components/schemas/Money'
        expires_at:
          type: [string, 'null']
          format: date-time
          description: End of the transfer window, for `BANK_TRANSFER`.
        paid_at:
          type: [string, 'null']
          format: date-time
          description: When staff confirmed the real money. Not when a QR was shown.

    Order:
      type: object
      required: [id, order_code, store_id, status, fulfillment_type, items, totals, payment, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        order_code:
          type: string
          description: Short human code staff and customers say out loud.
          examples: ['SCP-20261111-0042']
        store_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/OrderStatus'
        fulfillment_type:
          $ref: '#/components/schemas/FulfillmentType'
        fulfillment_status:
          oneOf:
            - $ref: '#/components/schemas/FulfillmentStatus'
            - type: 'null'
        scheduled_at:
          type: [string, 'null']
          format: date-time
        contact:
          type: object
          description: Snapshot of who to contact, taken at checkout.
          properties:
            name:
              type: string
            phone:
              type: string
            email:
              type: [string, 'null']
        delivery_address_line:
          type: [string, 'null']
          description: Snapshot. Deleting a saved address does not rewrite history.
        note:
          type: [string, 'null']
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        totals:
          $ref: '#/components/schemas/OrderTotals'
        payment:
          $ref: '#/components/schemas/PaymentSummary'
        status_history:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusChange'
        placed_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderSummary:
      type: object
      description: List projection. Enough for a queue row without loading every line.
      required: [id, order_code, status, total, item_count, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        order_code:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        fulfillment_type:
          $ref: '#/components/schemas/FulfillmentType'
        total:
          $ref: '#/components/schemas/Money'
        item_count:
          type: integer
        contact_name:
          type: [string, 'null']
        scheduled_at:
          type: [string, 'null']
          format: date-time
        placed_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    OrderSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderSummary'

    OrderCreated:
      type: object
      required: [order, payment]
      properties:
        order:
          $ref: '#/components/schemas/Order'
        payment:
          $ref: '#/components/schemas/OrderPayment'
        guest_order_token:
          type: [string, 'null']
          description: |
            Shown once, for a guest order only. Required as
            `X-Guest-Order-Token` on every later read. Only its hash is stored.

    CancelOrderRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: [string, 'null']
          maxLength: 255

    TransitionOrderRequest:
      type: object
      required: [to_status]
      additionalProperties: false
      properties:
        to_status:
          $ref: '#/components/schemas/OrderStatus'
        reason:
          type: [string, 'null']
          maxLength: 255
          description: Recorded in the status history. Required for `CANCELLED`.

    BankTransferInstructions:
      type: object
      description: |
        Everything the customer needs to pay and staff need to recognise the
        credit. The payload follows the VietQR/EMVCo structure so it scans in
        Vietnamese banking apps; amount and reference are encoded into it, not
        left for the customer to type.

        Showing this is **not** payment. Nothing here changes `status`.
      required: [transfer_reference, amount, bank, qr_payload]
      properties:
        transfer_reference:
          type: string
          description: |
            Unique, derived from the order code, within the character and length
            rules banks accept. This is how a statement line is matched back to
            an order, so it is generated rather than chosen by the customer.
          examples: ['SCP20261111A42']
        amount:
          $ref: '#/components/schemas/Money'
        bank:
          type: object
          required: [bin, name, account_number, account_name]
          properties:
            bin:
              type: string
              description: VietQR bank identifier.
            name:
              type: string
            account_number:
              type: string
              description: Shown in full here — the customer has to transfer to it.
            account_name:
              type: string
        qr_payload:
          type: string
          description: EMVCo payload string. Clients render it as a QR themselves.
        qr_image_url:
          type: [string, 'null']
          format: uri
          description: Optional server-rendered PNG, for contexts that cannot draw a QR.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: |
            After this the order may expire and release its stock. A transfer
            arriving later is a manual exception, never an automatic reopen.

    CashInstructions:
      type: object
      description: Where and when the money is handed over.
      properties:
        collect_at:
          type: string
          enum: [PICKUP_COUNTER, ON_DELIVERY]
        note:
          type: [string, 'null']

    OrderPayment:
      type: object
      required: [payment]
      properties:
        payment:
          $ref: '#/components/schemas/PaymentSummary'
        bank_transfer:
          oneOf:
            - $ref: '#/components/schemas/BankTransferInstructions'
            - type: 'null'
        cash:
          oneOf:
            - $ref: '#/components/schemas/CashInstructions'
            - type: 'null'

    PaymentDiscrepancy:
      type: object
      description: |
        A recorded difference between what arrived and what was owed. Kept as
        data rather than resolved automatically: under- and overpayment, a wrong
        reference or a late transfer are business decisions, and §15 has not
        settled the refund policy.
      required: [type, recorded_at]
      properties:
        type:
          type: string
          enum:
            - UNDERPAID
            - OVERPAID
            - MISSING_REFERENCE
            - UNKNOWN_REFERENCE
            - DUPLICATE_TRANSFER
            - LATE_TRANSFER
            - CANCELLED_ORDER_PAID
        expected_amount:
          $ref: '#/components/schemas/Money'
        observed_amount:
          $ref: '#/components/schemas/Money'
        note:
          type: [string, 'null']
        recorded_by:
          type: [string, 'null']
        recorded_at:
          type: string
          format: date-time

    PaymentEvent:
      type: object
      required: [event_type, created_at]
      properties:
        event_type:
          type: string
          examples: ['CONFIRMED']
        from_status:
          oneOf:
            - $ref: '#/components/schemas/PaymentStatus'
            - type: 'null'
        to_status:
          oneOf:
            - $ref: '#/components/schemas/PaymentStatus'
            - type: 'null'
        actor_name:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time

    AdminPayment:
      type: object
      description: |
        A payment as staff see it, with the order it belongs to and the trail of
        who did what.
      required: [id, order_id, order_code, method, status, amount]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        order_id:
          $ref: '#/components/schemas/Uuid'
        order_code:
          type: string
        store_id:
          $ref: '#/components/schemas/Uuid'
        method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          $ref: '#/components/schemas/Money'
          description: What the order is owed.
        confirmed_amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: What staff recorded as actually received.
        transfer_reference:
          type: [string, 'null']
        bank_transaction_reference:
          type: [string, 'null']
          description: The bank's own reference, as typed from a statement.
        bank_account_masked:
          type: [string, 'null']
        confirmed_by:
          type: [string, 'null']
          description: The person who said the money arrived. Never a system name.
        confirmed_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        needs_attention:
          type: boolean
        discrepancies:
          type: array
          items:
            $ref: '#/components/schemas/PaymentDiscrepancy'
        events:
          type: array
          items:
            $ref: '#/components/schemas/PaymentEvent'

    AdminPaymentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminPayment'

    ConfirmPaymentRequest:
      type: object
      required: [amount]
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: '^[0-9]+$'
          description: |
            Whole đồng actually received, as a string. Sent explicitly rather
            than assumed from the order total, so confirming the wrong amount
            takes a deliberate act and leaves a record of it.
        bank_transaction_reference:
          type: [string, 'null']
          maxLength: 120
          description: Required by store policy for `BANK_TRANSFER` in practice.
        observed_at:
          type: [string, 'null']
          format: date-time
          description: When the credit appeared on the statement, if not now.
        accept_discrepancy:
          type: boolean
          default: false
          description: |
            Acknowledges that `amount` differs from what is owed and confirms
            anyway. Without it a mismatch is refused with
            `PAYMENT_AMOUNT_MISMATCH` — an under- or overpayment must be a
            decision someone made, not a rounding the server performed.
        note:
          type: [string, 'null']
          maxLength: 500

    FlagPaymentRequest:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - UNDERPAID
            - OVERPAID
            - MISSING_REFERENCE
            - UNKNOWN_REFERENCE
            - DUPLICATE_TRANSFER
            - LATE_TRANSFER
            - CANCELLED_ORDER_PAID
        observed_amount:
          type: [string, 'null']
          pattern: '^[0-9]+$'
        note:
          type: [string, 'null']
          maxLength: 500

    StoreBankAccount:
      type: object
      required: [id, bank_bin, bank_name, account_number_masked, account_name, is_active]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        bank_bin:
          type: string
        bank_name:
          type: string
        account_number_masked:
          type: string
          description: |
            Masked on read. A UI only needs to show which account is configured,
            and the full number has no business sitting in a screenshot or a
            support ticket.
          examples: ['****3210']
        account_name:
          type: string
        is_default:
          type: boolean
        is_active:
          type: boolean
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: [string, 'null']

    UpdateStoreBankAccountRequest:
      type: object
      required: [bank_bin, account_number, account_name]
      additionalProperties: false
      properties:
        bank_bin:
          type: string
          pattern: '^[0-9]{6}$'
          description: Validated against the known VietQR BIN list.
        account_number:
          type: string
          pattern: '^[0-9]{6,20}$'
          description: Validated against the selected bank's own format.
        account_name:
          type: string
          maxLength: 160
          description: As registered at the bank; a mismatch can bounce a transfer.
        is_default:
          type: boolean
          default: true

    UpdateStorePaymentMethodsRequest:
      type: object
      required: [methods]
      additionalProperties: false
      properties:
        methods:
          type: array
          minItems: 1
          items:
            type: object
            required: [method, enabled]
            additionalProperties: false
            properties:
              method:
                $ref: '#/components/schemas/PaymentMethod'
              enabled:
                type: boolean

    CustomerProfile:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        pending_email:
          type: [string, 'null']
          format: email
          description: |
            A requested new address that is not yet verified. The login identity
            does not move until it is.
        created_at:
          type: string
          format: date-time

    UpdateCustomerProfileRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: [string, 'null']
          maxLength: 20
        email:
          type: [string, 'null']
          format: email
          maxLength: 254

    CustomerAddress:
      type: object
      required: [id, recipient_name, phone, address_line, is_default]
      x-provisional: true
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        recipient_name:
          type: string
        phone:
          type: string
        address_line:
          type: string
          description: |
            One free-text line rather than a street/city/postcode split, which
            is how a Vietnamese delivery address is actually written and spoken.
        note:
          type: [string, 'null']
        is_default:
          type: boolean

    CustomerAddressRequest:
      type: object
      required: [recipient_name, phone, address_line]
      additionalProperties: false
      x-provisional: true
      properties:
        recipient_name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          maxLength: 20
        address_line:
          type: string
          minLength: 1
          maxLength: 500
        note:
          type: [string, 'null']
          maxLength: 255
        is_default:
          type: boolean

    StockItem:
      type: object
      x-provisional: true
      description: |
        Capacity for one variant, at one store, on one service date. The
        finished-product model; ingredient-level counting is still open in §15.
      required: [id, store_id, variant_id, service_date, capacity, reserved_quantity, sold_quantity, available_quantity]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        store_id:
          $ref: '#/components/schemas/Uuid'
        variant_id:
          $ref: '#/components/schemas/Uuid'
        product_name:
          type: string
        variant_name:
          type: string
        service_date:
          type: string
          format: date
        slot_key:
          type: [string, 'null']
          description: Optional sub-day bucket, for stores that split a day into slots.
        capacity:
          type: integer
          minimum: 0
        reserved_quantity:
          type: integer
          minimum: 0
          description: Held for orders awaiting payment. Released when they expire.
        sold_quantity:
          type: integer
          minimum: 0
        available_quantity:
          type: integer
          minimum: 0
          description: Server-computed as capacity minus reserved minus sold.

    StockItemPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/StockItem'

    UpdateStockItemRequest:
      type: object
      required: [capacity]
      additionalProperties: false
      x-provisional: true
      properties:
        capacity:
          type: integer
          minimum: 0
          description: |
            An absolute value, never a delta. The server owns the arithmetic of
            reservations and sales; accepting a decrement here would reopen the
            lost-update race that row locking exists to close.
        reason:
          type: [string, 'null']
          maxLength: 255
          description: Recorded as a stock movement, so a day's changes are explainable.
