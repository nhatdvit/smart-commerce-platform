# Internal service names, resolved on the compose "frontend" network.

# PHP-FPM, FastCGI on 9000. Not an HTTP server.
upstream scp_api {
    server api:9000;
    keepalive 16;
}

upstream scp_customer_web {
    server customer-web:3001;
    keepalive 16;
}

upstream scp_admin_web {
    server admin-web:3002;
    keepalive 16;
}
