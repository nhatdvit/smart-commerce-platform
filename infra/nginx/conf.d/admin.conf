# Admin dashboard on its own hostname.
#
# Replace admin.localhost with the real hostname per environment. In production
# this server block should be restricted further - VPN, office IP allowlist, or
# SSO at the edge - because it is staff-only and never needs to be reachable
# from the open internet.

server {
    listen 8080;
    server_name admin.localhost;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/health/(live|ready)$ {
        access_log off;
        include /etc/nginx/conf.d/fastcgi-api.inc;
    }

    location ~ ^/api/v1/admin/(payments|stores) {
        limit_req zone=api_write burst=5 nodelay;
        include /etc/nginx/conf.d/fastcgi-api.inc;
    }

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        include /etc/nginx/conf.d/fastcgi-api.inc;
    }

    location = /sanctum/csrf-cookie {
        include /etc/nginx/conf.d/fastcgi-api.inc;
    }

    # Horizon dashboard. Reachable only on the admin host, and additionally
    # gated by a Gate in the application.
    location /horizon {
        include /etc/nginx/conf.d/fastcgi-api.inc;
    }

    # OpenAPI documentation (Scramble). Deliberately not routed on the public
    # storefront host: the API surface is staff-facing information, and
    # Scramble additionally gates it to non-production environments.
    location ~ ^/docs/api {
        include /etc/nginx/conf.d/fastcgi-api.inc;
    }

    # The DESIGNED contract (docs/api/openapi.yaml), rendered for review.
    #
    # Only reachable where compose.dev.yaml mounts docs/api into the gateway. In
    # a deployed environment the alias target does not exist, so this 404s - and
    # that is the intent: a design document is not an API deliverable, and the
    # staff host is not where it belongs once an environment is real.
    location = /docs/design {
        return 302 /docs/design/;
    }

    location /docs/design/ {
        alias /usr/share/nginx/html/api-design/;
        index design-viewer.html;
        autoindex off;

        # The packaged mime.types has no entry for .yaml, so without this the
        # spec is served as octet-stream and the renderer refuses to parse it.
        types {
            text/html html;
            application/yaml yaml;
            application/json json;
            text/markdown md;
        }
        default_type text/plain;

        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://scp_admin_web;
        proxy_read_timeout 30s;
    }
}
