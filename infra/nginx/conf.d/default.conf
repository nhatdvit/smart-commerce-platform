# Customer site and the public API.
#
# The api service is PHP-FPM, not an HTTP server, so API traffic goes over
# FastCGI. The Next.js apps are ordinary HTTP upstreams.
#
# TLS is terminated here in production: add the listen 8443 ssl block with the
# certificates mounted by compose.prod.yaml, keep HTTP for the ACME challenge
# and redirect everything else.

server {
    # default_server matters: nginx includes conf.d/*.conf alphabetically, so
    # admin.conf would otherwise own the default server for 8080 and every
    # request that is not exactly admin.localhost would reach the admin app.
    listen 8080 default_server;
    server_name _;

    # The gateway's own health, used by its container healthcheck.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Probes are proxied without rate limiting, so a traffic flood cannot make
    # a healthy instance look dead.
    location ~ ^/health/(live|ready)$ {
        access_log off;
        include /etc/nginx/conf.d/fastcgi-api.inc;
    }

    # Writes are limited far harder than reads: checkout and payment
    # confirmation are the expensive, stateful operations. The API applies its
    # own per-user limit as well; this sheds the obvious floods first.
    location ~ ^/api/v1/(orders|carts|payments|admin/payments) {
        limit_req zone=api_write burst=5 nodelay;
        limit_conn per_ip 10;
        include /etc/nginx/conf.d/fastcgi-api.inc;
    }

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        limit_conn per_ip 20;
        include /etc/nginx/conf.d/fastcgi-api.inc;
    }

    # Sanctum CSRF cookie endpoint, needed by the cookie-authenticated web apps.
    location = /sanctum/csrf-cookie {
        include /etc/nginx/conf.d/fastcgi-api.inc;
    }

    # Everything else is the customer storefront.
    location / {
        proxy_pass http://scp_customer_web;
        proxy_read_timeout 30s;
    }
}
